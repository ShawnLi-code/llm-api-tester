cases:
  - name: 黑名单列-API-135 - 正常请求
    method: GET
    path: /black_label/getBlackList
    params:
      pageNum: 1
      pageSize: 10
    expected:
      status: 200
      schema:
        type: object
        required: [records, total, size, current, orders, optimizeCountSql]
    tags: [正常流]
  - name: 黑名单列-API-144 - 正常请求
    method: GET
    path: /black_label/getUserBlackPhoneCount
    expected:
      status: 200
      schema:
        type: object
        required: [code, msg]
    tags: [正常流]
  - name: 黑名单列-API-145 - callScriptId 传入负数
    method: GET
    path: /black_label/getUserBlackPhoneCount
    expected:
      status: 400
    tags: [边界值]
  - name: 黑名单列-API-146 - callScriptId 传入超大值
    method: GET
    path: /black_label/getUserBlackPhoneCount
    expected:
      status: 400
    tags: [边界值]
  - name: 黑名单列-API-147 - callScriptId 传入非数字
    method: GET
    path: /black_label/getUserBlackPhoneCount
    expected:
      status: 400
    tags: [边界值]
