cases:
  - name: 黑名单列-API-135
    method: GET
    path: /black_label/getBlackList
    params:
      pageNum: 1
      pageSize: 10
    expected:
      status: 200
      schema:
        type: object
        required: [records, total, size, current, orders, optimizeCountSql]
    tags: [正常流]
  - name: 黑名单列-API-136 - 用POST调GET接口
    method: POST
    path: /black_label/getBlackList
    params:
      pageNum: 1
      pageSize: 10
    expected:
      status: 405
    tags: [异常]
  - name: 黑名单列-API-142 - 僵尸接口——直接调用验证是否仍在线
    method: DELETE
    path: /black_label/delete
    expected:
      status_in: [200, 404]
    tags: [僵尸验证]
  - name: 黑名单列-API-143 - 批量删除黑名单
    method: DELETE
    path: /black_label/batch/delete
    expected:
      status_in: [200, 404]
    tags: [僵尸验证]
  - name: 黑名单列-API-144 - 获取用户黑名单数量
