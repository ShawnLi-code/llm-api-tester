  - name: <p>-API-225 - userId 传入负数
    method: GET
    path: /balance/check/1
    expected:
      status: 400
    tags: [边界值]
  - name: <p>-API-226 - userId 传入超大值
    method: GET
    path: /balance/check/1
    expected:
      status: 400
    tags: [边界值]
  - name: <p>-API-227 - userId 传入非数字
    method: GET
    path: /balance/check/1
    expected:
      status: 400
    tags: [边界值]
