cases:
  - name: <p>-API-223
    method: GET
    path: /balance/check/1
    expected:
      status: 200
      schema:
        type: object
        required: [code, msg]
    tags: [正常流]
  - name: <p>-API-224 - 缺失必填参数 userId
    method: GET
    path: /balance/check/1
    expected:
      status: 400
    tags: [参数校验]
  - name: <p>-API-225 - userId 传入负数
    method: GET
    path: /balance/check/1
    expected:
      status: 400
    tags: [边界值]
  - name: <p>-API-226 - userId 传入超大值
    method: GET
    path: /balance/check/1
    expected:
      status: 400
    tags: [边界值]
  - name: <p>-API-227 - userId 传入非数字
    method: GET
    path: /balance/check/1
    expected:
      status: 400
    tags: [边界值]
  - name: <p>-API-228 - 用POST调GET接口
    method: POST
    path: /balance/check/1
    expected:
      status: 405
    tags: [异常]
  - name: <p>-API-234 - 未登录调用
    method: POST
    path: /balance/check/1
    headers:
      Authorization: 
    expected:
      status: 401
    tags: [权限]
  - name: <p>-API-235 - token过期调用
    method: POST
    path: /balance/check/1
    headers:
      Authorization: 
    expected:
      status: 401
    tags: [权限]
